name: dotnet Checks

on:
  push:
    branches: [ "main" ]

  pull_request:

  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    
    - name: Checkout
      uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
      with:
        fetch-depth: 0

    - name: Execute unit tests
      run: dotnet test scenarios/Scenarios.sln